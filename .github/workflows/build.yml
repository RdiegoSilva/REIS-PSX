name: Build REISPSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Instalar ferramentas
        run: apk add --no-cache make git

      - uses: actions/checkout@v4

      - name: Compilar
        run: make clean all

      - name: Salvar ELF
        uses: actions/upload-artifact@v4
        with:
          name: REISPSX
          path: REISPSX.ELF
